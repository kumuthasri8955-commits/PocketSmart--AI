<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketSmart AI - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h1>🤖 PocketSmart AI</h1>

        <p class="subtitle">
            Smart Budget & Recommendation Assistant
        </p>

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>


    <script>

        function login() {

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            if (!email || !password) {

                document.getElementById("message").innerText =
                    "Please enter email and password.";

                return;
            }

            window.location.href = "/";
        }

    </script>

</body>
</html>
